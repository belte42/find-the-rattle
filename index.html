<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Cookieless analytics; data-domains keeps local testing out of the stats -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="8ea2bcf5-af00-434a-8dde-108703c8caa7"
      data-domains="belte42.github.io,findtherattle.com,www.findtherattle.com"
    ></script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Find The Rattle – find rattles and buzzes in your car</title>
    <meta name="description" content="%DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%" />

    <link rel="icon" href="/volume-solid.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Find Rattle" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Link previews (Reddit, forums, chat apps) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Find The Rattle" />
    <meta property="og:title" content="Find The Rattle – find rattles and buzzes in your car" />
    <meta property="og:description" content="%DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Find The Rattle",
        "url": "%SITE_URL%",
        "description": "%DESCRIPTION%",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (web browser)",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
